<!doctype html>
<meta charset="utf-8">
<iframe id="site" src="/?v=brasil-diagnostic" style="width:390px;height:900px;border:0"></iframe>
<pre id="out">loading</pre>
<script>
const iframe = document.getElementById("site");

iframe.addEventListener("load", () => {
    setTimeout(() => {
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        const section = doc.querySelector("#brasil");
        const map = doc.querySelector(".brazil-real-shape");
        const svg = doc.querySelector(".brazil-map-svg");
        const points = [...doc.querySelectorAll(".map-point")];

        section.scrollIntoView();
        doc.querySelector(".point-nordeste").click();

        document.getElementById("out").textContent = JSON.stringify({
            viewport: win.innerWidth,
            bodyScrollWidth: doc.body.scrollWidth,
            docScrollWidth: doc.documentElement.scrollWidth,
            sectionWidth: Math.round(section.getBoundingClientRect().width),
            mapWidth: Math.round(map.getBoundingClientRect().width),
            mapHeight: Math.round(map.getBoundingClientRect().height),
            hasSvg: Boolean(svg),
            hasOldImageVisible: win.getComputedStyle(doc.querySelector(".brazil-map-real")).display,
            points: points.map(point => ({
                label: point.textContent.trim(),
                region: point.dataset.region,
                active: point.classList.contains("active"),
                left: Math.round(point.getBoundingClientRect().left - map.getBoundingClientRect().left),
                top: Math.round(point.getBoundingClientRect().top - map.getBoundingClientRect().top)
            })),
            regionTitle: doc.querySelector("#regionInfo h3").textContent,
            regionCode: doc.querySelector("#regionInfo .region-code").textContent
        }, null, 2);
    }, 4500);
});
</script>
